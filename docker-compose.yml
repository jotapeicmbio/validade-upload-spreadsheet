services:
  app:
    build:
      context: ./docker/development/php
      dockerfile: Dockerfile
      args:
        - user=${HOST_USER}
        - uid=${HOST_UID}
    container_name: dev_validade_upload_spreadsheet_app
    image: dev_validade_upload_spreadsheet_app
    working_dir: /var/www/html
    ports:
      - "8000-8004:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./package:/var/www/html
      - ./docker/development/php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
      - ./docker/development/php/conf.d/error_reporting.ini:/usr/local/etc/php/conf.d/error_reporting.ini

